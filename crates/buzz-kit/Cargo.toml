[package]
name = "buzz-kit"
version = "0.0.0-m0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Guarded collaboration through Buzz for coding agents"
repository = "https://github.com/brklyn8900/buzz-agent-kit"


[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", default-features = true, features = ["derive"] }
serde_json = { version = "=1.0.151", default-features = true, features = ["preserve_order"] }
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic"] }
bech32 = { version = "=0.12.0", default-features = true, features = [] }
getrandom = { version = "=0.4.3", default-features = true, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false, features = [] }
anyhow = { version = "=1.0.104", default-features = true, features = [] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }
zeroize = { version = "=1.9.0", default-features = true, features = ["std"] }
